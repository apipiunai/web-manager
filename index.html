<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Web Manager</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
        }

        button {
            border: 0;
            cursor: pointer;
            font-size: 15px;
        }

        /* =========================
           HOME
        ========================= */

        #home {
            min-height: 100vh;
            padding: 40px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 28px;
        }

        .actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 12px 20px;
            border-radius: 8px;
            background: #333;
            color: white;
        }

        .json-btn {
            min-width: 80px;
        }

        .btn:hover {
            background: #444;
        }

        .btn.primary {
            background: #fff;
            color: #111;
        }

        .btn.danger {
            background: #d32f2f;
            color: white;
        }

        .web-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 15px;
        }

        .web-card {
            position: relative;
            padding: 25px;
            min-height: 120px;
            background: #1d1d1d;
            border: 1px solid #333;
            border-radius: 12px;
            cursor: pointer;
            transition: .15s;
        }

        .web-card:hover {
            transform: translateY(-2px);
            border-color: #666;
        }

        .web-card h3 {
            margin-bottom: 10px;
        }

        .web-card p {
            color: #888;
            font-size: 13px;
            word-break: break-all;
        }

        .card-thumb {
            width: calc(100% + 50px);
            height: 110px;
            margin: -25px -25px 15px -25px;
            background: #111 center / cover no-repeat;
            border-radius: 12px 12px 0 0;
        }

        .delete-checkbox {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        .edit-card-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 30px;
            height: 30px;
            border-radius: 6px;
            background: rgba(0, 0, 0, .55);
            color: white;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: .15s;
        }

        .edit-card-btn:hover {
            background-color: #6f9bf4;
        }

        .empty {
            color: #777;
            position: fixed;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
        }

        /* =========================
           MODAL
        ========================= */

        .modal {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, .75);
            z-index: 100;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            width: min(450px, 90%);
            padding: 30px;
            background: #1d1d1d;
            border-radius: 12px;
        }

        .modal-content h2 {
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            color: #aaa;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #444;
            border-radius: 7px;
            outline: none;
            background: #111;
            color: white;
            font-family: inherit;
        }

        .form-group textarea {
            font-family: monospace;
            font-size: 13px;
            resize: vertical;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            border-color: #888;
        }

        .image-preview {
            display: none;
            max-width: 100%;
            max-height: 160px;
            margin-top: 10px;
            border-radius: 7px;
            object-fit: cover;
        }

        .remove-image-btn {
            display: none;
            margin-top: 8px;
            background: none;
            color: #d32f2f;
            font-size: 13px;
            text-decoration: underline;
            padding: 0;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 25px;
        }

        /* =========================
           IFRAME
        ========================= */

        #viewer {
            position: fixed;
            inset: 0;
            display: none;
            background: #000;
            z-index: 200;
        }

        #viewer.active {
            display: block;
        }

        #webFrame {
            width: 100%;
            height: 100%;
            border: none;
        }

        #backButton {
            position: fixed;
            top: 15px;
            left: 15px;
            z-index: 201;

            padding: 10px 16px;
            border-radius: 8px;

            background: rgba(0, 0, 0, .7);
            color: white;

            opacity: .3;
            transition: .2s;
        }

        #backButton:hover {
            opacity: 1;
        }

        #chapterNav {
            position: fixed;
            top: 15px;
            right: 25px;
            z-index: 201;

            display: flex;
            gap: 8px;
        }

        #chapterNav button {
            padding: 10px 16px;
            border-radius: 8px;

            background: rgba(0, 0, 0, .7);
            color: white;

            opacity: .3;
            transition: .2s;
        }

        #chapterNav button:hover {
            opacity: 1;
        }

        /* =========================
           DELETE MODE
        ========================= */

        #deleteActions {
            display: none;
        }

        #deleteActions.active {
            display: flex;
        }

        @media (max-width: 600px) {
            #home {
                padding: 20px;
            }

            .header {
                align-items: flex-start;
                flex-direction: column;
                gap: 20px;
            }
        }
    </style>
</head>

<body>

<!-- =========================
     HOME
========================= -->

<div id="home">

    <div class="header">

        <span></span>

        <div class="actions" id="normalActions">
            <button class="btn json-btn" id="copyJsonButton" title="Copiar todo el JSON al portapapeles">
                Copy
            </button>

            <button class="btn json-btn" id="importJsonButton" title="Importar array de webs en JSON">
                Import
            </button>

            <button class="btn  json-btn primary" id="addButton">
                Add
            </button>

            <button class="btn  json-btn danger" id="deleteButton">
                Delete
            </button>
        </div>

        <div class="actions" id="deleteActions">

            <button class="btn" id="cancelDeleteButton">
                Cancelar
            </button>

            <button class="btn danger" id="confirmDeleteButton">
                Confirmar
            </button>

        </div>

    </div>

    <div id="webList" class="web-list"></div>

</div>


<!-- =========================
     ADD MODAL
========================= -->

<div id="addModal" class="modal">

    <div class="modal-content">

        <h2 id="modalTitle">Añadir web</h2>

        <form id="addForm">

            <div class="form-group">

                <label for="title">
                    Título
                </label>

                <input
                    id="title"
                    type="text"
                    placeholder="Mi aplicación"
                    required
                >

            </div>

            <div class="form-group">

                <label for="url">
                    URL
                </label>

                <input
                    id="url"
                    type="url"
                    placeholder="https://ejemplo.com"
                    required
                >

            </div>

            <div class="form-group">

                <label for="image">
                    Imagen (opcional)
                </label>

                <input
                    id="image"
                    type="text"
                    placeholder="Pega una URL de imagen, o pega (Ctrl+V) una imagen copiada"
                >

                <img class="image-preview" id="imagePreview" alt="">

                <button
                    type="button"
                    class="remove-image-btn"
                    id="removeImageButton"
                >
                    Quitar imagen
                </button>

            </div>

            <div class="modal-actions">

                <button
                    type="button"
                    class="btn"
                    id="cancelAddButton"
                >
                    Cancelar
                </button>

                <button
                    type="submit"
                    class="btn primary"
                    id="submitButton"
                >
                    Añadir
                </button>

            </div>

        </form>

    </div>

</div>


<!-- =========================
     IMPORT MODAL
========================= -->

<div id="importModal" class="modal">

    <div class="modal-content">

        <h2>Importar JSON</h2>

        <div class="form-group">

            <label for="importJsonInput">
                Pega aquí el array JSON de webs
            </label>

            <textarea
                id="importJsonInput"
                rows="8"
                placeholder='[&#10;  {&#10;    "title": "Mi web",&#10;    "url": "https://ejemplo.com",&#10;    "image": ""&#10;  }&#10;]'
            ></textarea>

        </div>

        <div class="modal-actions" style="justify-content: space-between;">

            <button
                type="button"
                class="btn"
                id="cancelImportButton"
            >
                Cancelar
            </button>

            <div style="display: flex; gap: 10px;">
                <button
                    type="button"
                    class="btn"
                    id="importAppendButton"
                    title="Añadir a las webs existentes"
                >
                    Añadir
                </button>

            </div>

        </div>

    </div>

</div>


<!-- =========================
     VIEWER
========================= -->

<div id="viewer">

    <button id="backButton">
        ←
    </button>

    <div id="chapterNav">
        <button id="prevChapterButton">
            ‹ 
        </button>
        <button id="nextChapterButton">
             ›
        </button>
    </div>

    <iframe
        id="webFrame"
        allow="fullscreen"
    ></iframe>

</div>


<script>

    const STORAGE_KEY = "embeddedWebs";

    let webs = loadWebs();
    let deleteMode = false;
    let currentWebId = null;


    /* =========================
       STORAGE
    ========================= */

    function loadWebs() {
        try {
            return JSON.parse(
                localStorage.getItem(STORAGE_KEY)
            ) || [];
        } catch {
            return [];
        }
    }


    function saveWebs() {
        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(webs)
        );
    }


    /* =========================
       DOM
    ========================= */

    const webList = document.getElementById("webList");

    const addModal = document.getElementById("addModal");

    const addForm = document.getElementById("addForm");

    const viewer = document.getElementById("viewer");

    const webFrame = document.getElementById("webFrame");

    const normalActions =
        document.getElementById("normalActions");
        normalActions.style.justifyContent = "end";

    const deleteActions =
        document.getElementById("deleteActions");

    const importModal =
        document.getElementById("importModal");

    const importJsonInput =
        document.getElementById("importJsonInput");

    const copyJsonButton =
        document.getElementById("copyJsonButton");

    const importJsonButton =
        document.getElementById("importJsonButton");

    const cancelImportButton =
        document.getElementById("cancelImportButton");

    const importAppendButton =
        document.getElementById("importAppendButton");

    const importReplaceButton =
        document.getElementById("importReplaceButton");


    /* =========================
       RENDER
    ========================= */

    function render() {

        webList.innerHTML = "";

        if (webs.length === 0) {

            webList.innerHTML = `
                <div class="empty">
                    No hay webs añadidas.
                </div>
            `;

            return;
        }

        webs.forEach(web => {

            const card = document.createElement("div");

            card.className = "web-card";

            card.dataset.id = web.id;

            card.innerHTML = `
                <h3>${escapeHtml(web.title)}</h3>
                <p>${escapeHtml(web.url)}</p>
            `;

            if (web.image) {

                const thumb =
                    document.createElement("div");

                thumb.className = "card-thumb";

                thumb.style.backgroundImage =
                    `url("${web.image}")`;

                card.prepend(thumb);

            }

            if (deleteMode) {

                const checkbox =
                    document.createElement("input");

                checkbox.type = "checkbox";

                checkbox.className =
                    "delete-checkbox";

                checkbox.dataset.id = web.id;

                checkbox.addEventListener(
                    "click",
                    event => event.stopPropagation()
                );

                card.appendChild(checkbox);

            } else {

                card.addEventListener(
                    "click",
                    () => openWeb(web.id)
                );

                const editBtn =
                    document.createElement("button");

                editBtn.className = "edit-card-btn";

                editBtn.textContent = "✎";

                editBtn.title = "Editar";

                editBtn.addEventListener("click", event => {

                    event.stopPropagation();

                    openEditModal(web.id);

                });

                card.appendChild(editBtn);

            }

            webList.appendChild(card);
        });
    }


    /* =========================
       ADD / EDIT
    ========================= */

    let editingWebId = null;
    let pendingImageValue = "";

    const modalTitle =
        document.getElementById("modalTitle");

    const submitButton =
        document.getElementById("submitButton");

    const imageInput =
        document.getElementById("image");

    const imagePreview =
        document.getElementById("imagePreview");

    const removeImageButton =
        document.getElementById("removeImageButton");


    function isDataUrl(value) {
        return !!value && value.startsWith("data:");
    }


    /*
     * Actualiza el estado de la imagen a guardar (URL o base64) y
     * su vista previa. `displayText` es lo que se muestra en el
     * input: para una imagen pegada del portapapeles no mostramos
     * el base64 entero, solo un texto indicativo.
     */
    function setImage(value, displayText) {

        pendingImageValue = value || "";

        imageInput.value =
            displayText !== undefined ? displayText : pendingImageValue;

        if (pendingImageValue) {

            imagePreview.src = pendingImageValue;

            imagePreview.style.display = "block";

            removeImageButton.style.display = "inline";

        } else {

            imagePreview.style.display = "none";

            removeImageButton.style.display = "none";

        }

    }


    /*
     * Al pegar en el campo de imagen: si el portapapeles trae una
     * imagen (copiada de otra web, un explorador de archivos, una
     * captura...), la convertimos a base64 con FileReader. Si trae
     * texto (una URL), dejamos que se pegue normal y la guardamos
     * tal cual.
     */
    imageInput.addEventListener("paste", event => {

        const items = event.clipboardData?.items;

        if (items) {

            for (const item of items) {

                if (item.type.startsWith("image/")) {

                    event.preventDefault();

                    const file = item.getAsFile();

                    const reader = new FileReader();

                    reader.onload = () => {
                        setImage(reader.result, "[Imagen pegada]");
                    };

                    reader.readAsDataURL(file);

                    return;

                }

            }

        }

        setTimeout(() => {
            setImage(imageInput.value.trim());
        }, 0);

    });


    imageInput.addEventListener("input", () => {
        setImage(imageInput.value.trim());
    });


    removeImageButton.addEventListener("click", () => {
        setImage("", "");
    });


    document
        .getElementById("addButton")
        .addEventListener("click", openAddModal);


    function openAddModal() {

        editingWebId = null;

        modalTitle.textContent = "Añadir web";

        submitButton.textContent = "Añadir";

        addForm.reset();

        setImage("", "");

        addModal.classList.add("active");

        document.getElementById("title").focus();

    }


    function openEditModal(id) {

        const web = webs.find(item => item.id === id);

        if (!web) return;

        editingWebId = id;

        modalTitle.textContent = "Editar web";

        submitButton.textContent = "Guardar";

        document.getElementById("title").value = web.title;

        document.getElementById("url").value = web.url;

        setImage(
            web.image || "",
            isDataUrl(web.image) ? "[Imagen pegada]" : (web.image || "")
        );

        addModal.classList.add("active");

        document.getElementById("title").focus();

    }


    document
        .getElementById("cancelAddButton")
        .addEventListener("click", closeAddModal);


    function closeAddModal() {

        addModal.classList.remove("active");

        addForm.reset();

        editingWebId = null;

        setImage("", "");

    }


    addForm.addEventListener("submit", event => {

        event.preventDefault();

        const title =
            document.getElementById("title")
                .value
                .trim();

        let url =
            document.getElementById("url")
                .value
                .trim();

        if (!/^https?:\/\//i.test(url)) {
            url = "https://" + url;
        }

        try {
            new URL(url);
        } catch {
            alert("La URL no es válida.");
            return;
        }

        const image = pendingImageValue;

        if (editingWebId) {

            const web =
                webs.find(item => item.id === editingWebId);

            if (web) {
                web.title = title;
                web.url = url;
                web.image = image;
            }

        } else {

            webs.push({
                id: crypto.randomUUID(),
                title,
                url,
                image
            });

        }

        saveWebs();

        closeAddModal();

        render();

    });


    /* =========================
       IMPORT / EXPORT JSON
    ========================= */

    async function copyStorageJson() {

        const json = JSON.stringify(webs, null, 2);

        try {

            if (navigator.clipboard && navigator.clipboard.writeText) {
                await navigator.clipboard.writeText(json);
            } else {
                const textarea = document.createElement("textarea");
                textarea.value = json;
                textarea.style.position = "fixed";
                textarea.style.opacity = "0";
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand("copy");
                document.body.removeChild(textarea);
            }

            if (copyJsonButton) {
                const originalText = copyJsonButton.textContent;
                copyJsonButton.textContent = "¡Copied!";
                setTimeout(() => {
                    copyJsonButton.textContent = originalText;
                }, 2000);
            }

            return json;

        } catch (err) {

            console.error("Error al copiar al portapapeles:", err);
            alert("No se pudo copiar automáticamente al portapapeles.");
            return json;

        }

    }


    function importStorageJson(rawInput, replaceAll = false) {

        try {

            let data = rawInput;

            if (typeof rawInput === "string") {

                const trimmed = rawInput.trim();

                if (!trimmed) {
                    alert("Por favor, pega un JSON válido.");
                    return false;
                }

                data = JSON.parse(trimmed);

            }

            if (!Array.isArray(data)) {

                if (data && typeof data === "object") {
                    data = [data];
                } else {
                    throw new Error("El JSON debe ser un array de objetos.");
                }

            }

            const parsedWebs = [];

            for (const item of data) {

                if (!item || typeof item !== "object") continue;

                let title = String(item.title || "").trim();
                let url = String(item.url || "").trim();
                let image = typeof item.image === "string" ? item.image : "";

                if (!url && !title) continue;

                if (url && !/^https?:\/\//i.test(url)) {
                    url = "https://" + url;
                }

                if (!title) {
                    try {
                        title = new URL(url).hostname;
                    } catch {
                        title = url || "Sin título";
                    }
                }

                parsedWebs.push({
                    id: item.id && typeof item.id === "string" ? item.id : crypto.randomUUID(),
                    title,
                    url,
                    image
                });

            }

            if (parsedWebs.length === 0) {
                alert("No se encontraron webs válidas en el JSON proporcionado.");
                return false;
            }

            if (replaceAll) {

                webs = parsedWebs;

            } else {

                const existingIds = new Set(webs.map(w => w.id));

                for (const item of parsedWebs) {
                    if (existingIds.has(item.id)) {
                        item.id = crypto.randomUUID();
                    }
                    webs.push(item);
                }

            }

            saveWebs();

            render();

            return true;

        } catch (err) {

            console.error("Error al importar JSON:", err);
            alert("Error al procesar el JSON: " + err.message);
            return false;

        }

    }


    window.copyStorageJson = copyStorageJson;
    window.importStorageJson = importStorageJson;


    copyJsonButton.addEventListener("click", () => {
        copyStorageJson();
    });


    importJsonButton.addEventListener("click", () => {
        importJsonInput.value = "";
        importModal.classList.add("active");
        importJsonInput.focus();
    });


    cancelImportButton.addEventListener("click", () => {
        importModal.classList.remove("active");
        importJsonInput.value = "";
    });


    importAppendButton.addEventListener("click", () => {
        const success = importStorageJson(importJsonInput.value, false);
        if (success) {
            importModal.classList.remove("active");
            importJsonInput.value = "";
        }
    });


    /* =========================
       DELETE MODE
    ========================= */

    document
        .getElementById("deleteButton")
        .addEventListener("click", () => {

            if (webs.length === 0) {
                return;
            }

            deleteMode = true;

            normalActions.style.display = "none";

            deleteActions.classList.add("active");

            render();

        });


    document
        .getElementById("cancelDeleteButton")
        .addEventListener("click", () => {

            deleteMode = false;

            normalActions.style.display = "flex";

            deleteActions.classList.remove("active");

            render();

        });


    document
        .getElementById("confirmDeleteButton")
        .addEventListener("click", () => {

            const selected = [
                ...document.querySelectorAll(
                    ".delete-checkbox:checked"
                )
            ].map(
                checkbox => checkbox.dataset.id
            );

            webs = webs.filter(
                web => !selected.includes(web.id)
            );

            saveWebs();

            deleteMode = false;

            normalActions.style.display = "flex";

            deleteActions.classList.remove("active");

            render();

        });


    /* =========================
       OPEN WEB
    ========================= */

    function openWeb(id) {

        const web = webs.find(
            item => item.id === id
        );

        if (!web) return;

        currentWebId = id;

        webFrame.src = web.url;

        viewer.classList.add("active");

    }


    /* =========================
       CHAPTER NAV
    ========================= */

    /*
     * Busca el número de capítulo en la URL y le suma/resta
     * `delta`. Soporta dos formatos:
     *
     *  1. "-{capitulo}_{pagina}"  →  ej. "...-1_01"
     *     Se detecta el guion seguido de un número (entero o con
     *     decimal) y un guion bajo. Solo se toca el número del
     *     capítulo; la página ("_01") se deja tal cual.
     *
     *     Si el capítulo tiene decimales (ej. "0.5", capítulos
     *     extra/especiales), en vez de sumar el delta al decimal
     *     (lo que daría "1.5"), se redondea al entero completo en
     *     la dirección del desplazamiento: "Siguiente" redondea
     *     hacia arriba (0.5 → 1), "Anterior" redondea hacia abajo
     *     (0.5 → 0). Esto es una suposición razonable para
     *     capítulos especiales — dime si tu caso es distinto.
     *
     *  2. Cualquier otro caso: se usa el último número que
     *     aparezca en la URL (comportamiento anterior), con
     *     ceros a la izquierda preservados.
     */
    function shiftChapterUrl(url, delta) {

        const chapterPageMatches = [
            ...url.matchAll(/-(\d+(?:\.\d+)?)_(\d+)/g)
        ];

        if (chapterPageMatches.length > 0) {

            const match =
                chapterPageMatches[chapterPageMatches.length - 1];

            const chapterStr = match[1];

            const chapterNum = parseFloat(chapterStr);

            const newChapterNum = chapterStr.includes(".")
                ? (delta > 0
                    ? Math.ceil(chapterNum)
                    : Math.floor(chapterNum))
                : chapterNum + delta;

            if (newChapterNum < 0) return null;

            const start = match.index + 1; // +1 para saltar el "-"
            const end = start + chapterStr.length;

            return (
                url.slice(0, start) +
                newChapterNum +
                url.slice(end)
            );

        }

        const match = url.match(/(\d+)(?!.*\d)/);

        if (!match) return null;

        const numStr = match[1];

        const newNum = parseInt(numStr, 10) + delta;

        if (newNum < 0) return null;

        let newNumStr = String(newNum);

        if (numStr.length > 1 && numStr.startsWith("0")) {
            newNumStr = newNumStr.padStart(numStr.length, "0");
        }

        return (
            url.slice(0, match.index) +
            newNumStr +
            url.slice(match.index + numStr.length)
        );

    }


    function goToChapter(delta) {

        if (!currentWebId) return;

        const web =
            webs.find(
                item => item.id === currentWebId
            );

        if (!web) return;

        const newUrl = shiftChapterUrl(web.url, delta);

        if (!newUrl) {
            alert("No se ha encontrado ningún número en la URL.");
            return;
        }

        web.url = newUrl;

        saveWebs();

        webFrame.src = newUrl;

        render();

    }


    document
        .getElementById("prevChapterButton")
        .addEventListener("click", () => goToChapter(-1));


    document
        .getElementById("nextChapterButton")
        .addEventListener("click", () => goToChapter(1));


    /* =========================
       CLOSE WEB
    ========================= */

    document
        .getElementById("backButton")
        .addEventListener("click", closeViewer);


    function closeViewer() {

        updateCurrentUrl();

        viewer.classList.remove("active");

        webFrame.src = "";

        currentWebId = null;

    }


    /* =========================
       URL SYNC
    ========================= */

    /*
     * IMPORTANTE — Same-Origin Policy:
     *
     * Solo podemos leer `webFrame.contentWindow.location.href`
     * cuando el iframe carga contenido del MISMO origen que esta
     * página. En cuanto navega a un dominio externo (el caso
     * habitual aquí), el navegador bloquea el acceso y lanza un
     * SecurityError — por eso el bloque catch de abajo existe.
     *
     * Esto es una restricción de seguridad del navegador, no un
     * bug: ninguna web puede leer la URL interna de un iframe
     * ajeno (si pudiera, cualquier página podría espiar tu
     * navegación dentro de un iframe con tu banco, por ejemplo).
     * No hay forma de saltársela desde JS del lado del padre.
     *
     * Además, muchos sitios grandes (Google, X, YouTube...)
     * bloquean directamente que se les embeba en un iframe
     * mediante cabeceras X-Frame-Options / CSP, y ahí ni siquiera
     * llegará a cargar contenido.
     *
     * Lo que SÍ funciona:
     *  - Webs que sirvas tú mismo desde el mismo origen que esta
     *    página: la lectura de location.href funcionará sin
     *    problema.
     *  - Webs de terceros que tú controles y a las que puedas
     *    añadir un pequeño script para que avisen activamente de
     *    su URL vía postMessage (ver listener más abajo). Eso sí
     *    esquiva la restricción, porque la propia web colabora.
     */

    function updateCurrentUrl() {

        if (!currentWebId) return;

        const web =
            webs.find(
                item => item.id === currentWebId
            );

        if (!web) return;

        try {

            const currentUrl =
                webFrame.contentWindow.location.href;

            if (
                currentUrl &&
                currentUrl !== "about:blank" &&
                currentUrl !== web.url
            ) {

                web.url = currentUrl;

                saveWebs();

                render();

            }

        } catch (error) {

            /*
             * Iframe cross-origin: no podemos leer su URL.
             * No hacemos nada — es el comportamiento esperado
             * para la inmensa mayoría de webs embebidas.
             */

        }

    }

    /*
     * En vez de sondear cada 500ms, escuchamos el evento "load"
     * del propio iframe: se dispara en cada navegación completa
     * (incluidas las de sitios cross-origin), así que es el punto
     * correcto para intentar leer la URL — sin gastar ciclos de
     * CPU sondeando constantemente.
     *
     * Ojo: en sitios que son SPA (navegación por History API sin
     * recarga completa) este evento no se disparará en cada
     * "página" interna, aunque sí en la carga inicial.
     */
    webFrame.addEventListener("load", updateCurrentUrl);

    /*
     * Vía de escape para webs que SÍ controlas: si añades este
     * pequeño script en la página embebida, evita por completo la
     * restricción de origen cruzado avisando activamente de su URL:
     *
     *   window.parent.postMessage(
     *       { type: "web-manager:url", url: location.href },
     *       "*"
     *   );
     *
     * Llamando a eso en el load de la página y cada vez que cambie
     * la URL (p.ej. en un listener de "popstate" o tras un
     * pushState), este listener la recogerá automáticamente.
     */
    window.addEventListener("message", event => {

        if (
            !event.data ||
            event.data.type !== "web-manager:url" ||
            !currentWebId
        ) {
            return;
        }

        const web =
            webs.find(
                item => item.id === currentWebId
            );

        if (!web) return;

        if (event.data.url && event.data.url !== web.url) {

            web.url = event.data.url;

            saveWebs();

            render();

        }

    });


    /* =========================
       SECURITY
    ========================= */

    function escapeHtml(value) {

        const div =
            document.createElement("div");

        div.textContent = value;

        return div.innerHTML;

    }


    /* =========================
       INIT
    ========================= */

    render();

</script>
